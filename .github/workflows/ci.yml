name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install and validate dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci

  test:
    name: Lint and test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      # Each GitHub Actions job gets a fresh runner, so dependencies must be
      # installed again here; the install job's filesystem is not shared.
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
